<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="60">
<title>Room Changes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#0B1F4B;--navy-lite:#1E3A7A;--gold:#C9A227;--gold-lite:#E8BF50;--muted:rgba(255,255,255,0.45);--row-alt:rgba(255,255,255,0.035);--separator:rgba(201,162,39,0.35)}
html,body{height:100%;font-family:'Inter','Segoe UI',Arial,sans-serif;background:var(--navy);color:#fff;overflow:hidden}
body{display:flex;flex-direction:column;padding:2.2vh 3vw 1.5vh;gap:2vh}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--gold);padding-bottom:1.6vh;flex-shrink:0}
.header-left h1{font-size:clamp(1.6rem,4vw,3rem);font-weight:800;letter-spacing:-0.03em;line-height:1}
.header-left .subtitle{font-size:clamp(0.9rem,1.8vw,1.4rem);font-weight:500;color:var(--gold-lite);margin-top:0.4vh;letter-spacing:0.02em}
.header-right{text-align:right}
.clock{font-size:clamp(1.8rem,4.5vw,3.2rem);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;line-height:1}
.clock-date{font-size:clamp(0.75rem,1.4vw,1rem);color:var(--muted);margin-top:0.3vh}
.table-wrap{flex:1;overflow:hidden;display:flex;flex-direction:column}
table{width:100%;border-collapse:collapse;table-layout:fixed}
col:nth-child(1){width:10%}col:nth-child(2){width:30%}col:nth-child(3){width:30%}col:nth-child(4){width:30%}
thead th{background:var(--navy-lite);padding:clamp(0.5rem,1.2vh,1rem) clamp(0.6rem,1.5vw,1.5rem);text-align:left;font-size:clamp(0.7rem,1.4vw,1rem);font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold-lite);border-bottom:2px solid var(--gold)}
tbody tr{border-bottom:1px solid rgba(255,255,255,0.06)}
tbody tr:nth-child(even){background:var(--row-alt)}
tbody tr.period-break td{border-top:2px solid var(--separator);padding-top:clamp(0.7rem,1.5vh,1.2rem)}
td{padding:clamp(0.45rem,1.1vh,0.9rem) clamp(0.6rem,1.5vw,1.5rem);font-size:clamp(0.8rem,1.9vw,1.35rem);vertical-align:middle}
td.period{font-weight:800;font-size:clamp(1rem,2.4vw,1.7rem);color:var(--gold);letter-spacing:-0.02em}
td.new-room{font-weight:600;color:#7EE8A2}
td.old-room{color:rgba(255,255,255,0.55);text-decoration:line-through;text-decoration-color:rgba(255,255,255,0.25)}
footer{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;padding-top:1vh;border-top:1px solid rgba(255,255,255,0.1)}
.notice{font-size:clamp(0.6rem,1vw,0.8rem);color:var(--muted)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:6px;vertical-align:middle;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.2}}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <h1>Room Changes</h1>
    <div class="subtitle"></div>
  </div>
  <div class="header-right">
    <div class="clock" id="clock">--:--</div>
    <div class="clock-date" id="clockDate"></div>
  </div>
</header>
<div class="table-wrap">
  <table>
    <colgroup><col><col><col><col></colgroup>
    <thead><tr><th>Period</th><th>Class</th><th>Old Room</th><th>New Room</th></tr></thead>
    <tbody><tr><td class="period">5</td><td>12C/His</td><td class="old-room">HU9</td><td class="new-room">ME1</td></tr><tr><td class="period">5</td><td>12C/Ma</td><td class="old-room">MA10</td><td class="new-room">Ma8</td></tr><tr><td class="period">5</td><td>8C/Re</td><td class="old-room">HU7</td><td class="new-room">Sc3</td></tr><tr><td class="period">5</td><td>11B/Dr</td><td class="old-room">HU8</td><td class="new-room">EN2</td></tr><tr><td class="period">5</td><td>8Y2/Ma</td><td class="old-room">MA</td><td class="new-room">MU1</td></tr></tbody>
  </table>
</div>
<footer>
  <div class="notice"><span class="dot"></span>Refreshes automatically every minute</div>
  <div class="notice">Published: 11/05/2026, 14:59:54</div>
</footer>
<script>
function tick(){
  var n=new Date();
  document.getElementById('clock').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  document.getElementById('clockDate').textContent=n.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
