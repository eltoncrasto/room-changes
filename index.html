<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Changes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy:      #0B1F4B;
      --navy-mid:  #132960;
      --navy-lite: #1E3A7A;
      --gold:      #C9A227;
      --gold-lite: #E8BF50;
      --white:     #FFFFFF;
      --muted:     rgba(255,255,255,0.45);
      --row-alt:   rgba(255,255,255,0.035);
      --separator: rgba(201,162,39,0.35);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      background: var(--navy);
      color: var(--white);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 2.2vh 3vw 1.5vh;
      gap: 2vh;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--gold);
      padding-bottom: 1.6vh;
      flex-shrink: 0;
    }

    .header-left h1 {
      font-size: clamp(1.6rem, 4vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--white);
      line-height: 1;
    }

    .header-left .subtitle {
      font-size: clamp(0.9rem, 1.8vw, 1.4rem);
      font-weight: 500;
      color: var(--gold-lite);
      margin-top: 0.4vh;
      letter-spacing: 0.02em;
    }

    .header-right {
      text-align: right;
    }

    .clock {
      font-size: clamp(1.8rem, 4.5vw, 3.2rem);
      font-weight: 700;
      color: var(--white);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .clock-date {
      font-size: clamp(0.75rem, 1.4vw, 1rem);
      color: var(--muted);
      margin-top: 0.3vh;
      text-align: right;
    }

    /* ── Table wrapper ── */
    .table-wrap {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    colgroup col:nth-child(1) { width: 10%; }
    colgroup col:nth-child(2) { width: 30%; }
    colgroup col:nth-child(3) { width: 30%; }
    colgroup col:nth-child(4) { width: 30%; }

    thead th {
      background: var(--navy-lite);
      padding: clamp(0.5rem, 1.2vh, 1rem) clamp(0.6rem, 1.5vw, 1.5rem);
      text-align: left;
      font-size: clamp(0.7rem, 1.4vw, 1rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold-lite);
      border-bottom: 2px solid var(--gold);
      position: sticky;
      top: 0;
    }

    tbody { overflow-y: auto; }

    tbody tr {
      border-bottom: 1px solid rgba(255,255,255,0.06);
      transition: background 0.15s;
    }

    tbody tr:nth-child(even) { background: var(--row-alt); }

    tbody tr.period-break td {
      border-top: 2px solid var(--separator);
      padding-top: clamp(0.7rem, 1.5vh, 1.2rem);
    }

    td {
      padding: clamp(0.45rem, 1.1vh, 0.9rem) clamp(0.6rem, 1.5vw, 1.5rem);
      font-size: clamp(0.8rem, 1.9vw, 1.35rem);
      font-weight: 400;
      vertical-align: middle;
    }

    td.period {
      font-weight: 800;
      font-size: clamp(1rem, 2.4vw, 1.7rem);
      color: var(--gold);
      letter-spacing: -0.02em;
    }

    td.new-room {
      font-weight: 600;
      color: #7EE8A2;
    }

    td.old-room {
      color: rgba(255,255,255,0.55);
      text-decoration: line-through;
      text-decoration-color: rgba(255,255,255,0.25);
    }

    /* ── Footer ── */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      padding-top: 1vh;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .refresh-notice {
      font-size: clamp(0.6rem, 1vw, 0.8rem);
      color: var(--muted);
    }

    .refresh-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      margin-right: 6px;
      vertical-align: middle;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    /* ── States ── */
    #stateMsg {
      display: none;
      flex: 1;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: var(--muted);
    }

    #stateMsg.error { color: #ff6b6b; }
    #stateMsg.show  { display: flex; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <h1 id="pageTitle">Room Changes</h1>
      <div class="subtitle" id="pageDate">Loading…</div>
    </div>
    <div class="header-right">
      <div class="clock" id="clock">--:--</div>
      <div class="clock-date" id="clockDate"></div>
    </div>
  </header>

  <div class="table-wrap" id="tableWrap">
    <div id="stateMsg" class="show">Loading room changes…</div>
    <table id="roomTable" style="display:none">
      <colgroup>
        <col><col><col><col>
      </colgroup>
      <thead>
        <tr>
          <th>Period</th>
          <th>Class</th>
          <th>Old Room</th>
          <th>New Room</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <footer>
    <div class="refresh-notice">
      <span class="refresh-dot"></span>
      Refreshes automatically every 30 seconds
    </div>
    <div class="refresh-notice" id="lastUpdated"></div>
  </footer>

  <script>
    // ── Clock ──────────────────────────────────────────────
    function tickClock() {
      const now  = new Date();
      const hh   = String(now.getHours()).padStart(2,'0');
      const mm   = String(now.getMinutes()).padStart(2,'0');
      document.getElementById('clock').textContent = `${hh}:${mm}`;
      document.getElementById('clockDate').textContent = now.toLocaleDateString('en-GB', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
    }
    tickClock();
    setInterval(tickClock, 1000);

    // ── Helpers ────────────────────────────────────────────
    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── Data load ──────────────────────────────────────────
    async function loadData() {
      try {
        const dataUrl = new URL('data.json', 'https://eltoncrasto.github.io/room-changes/');
        dataUrl.searchParams.set('_', Date.now());
        const res = await fetch(dataUrl.toString());
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        document.getElementById('pageTitle').textContent = data.title || 'Room Changes';
        document.getElementById('pageDate').textContent  = data.date  || '';

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        let lastPeriod = null;

        (data.rows || []).forEach(row => {
          const tr = document.createElement('tr');
          if (lastPeriod !== null && row.period !== lastPeriod) {
            tr.classList.add('period-break');
          }
          tr.innerHTML =
            `<td class="period">${esc(row.period)}</td>` +
            `<td>${esc(row.class)}</td>` +
            `<td class="old-room">${esc(row.oldRoom)}</td>` +
            `<td class="new-room">${esc(row.newRoom)}</td>`;
          tbody.appendChild(tr);
          lastPeriod = row.period;
        });

        document.getElementById('stateMsg').classList.remove('show','error');
        document.getElementById('roomTable').style.display = 'table';
        document.getElementById('lastUpdated').textContent =
          `Last updated: ${new Date().toLocaleTimeString('en-GB')}`;

      } catch (err) {
        const msg = document.getElementById('stateMsg');
        msg.textContent = 'Unable to load room changes — please check back shortly.';
        msg.classList.add('show','error');
        document.getElementById('roomTable').style.display = 'none';
        console.error('Data load error:', err);
      }
    }

    loadData();
    setInterval(loadData, 30000);
  </script>
</body>
</html>
